services:
  gateway-api:
    build:
      context: ../gateway-api
      dockerfile: Dockerfile
    container_name: gateway-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ReverseProxy__Clusters__estoque-cluster__Destinations__estoque-destination__Address=http://estoque-api:8080
      - ReverseProxy__Clusters__faturamento-cluster__Destinations__faturamento-destination__Address=http://faturamento-api:8082
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    depends_on:
      estoque-api:
        condition: service_healthy
      faturamento-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app-network
      - messaging-network
      - observability-network

  frontend-web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend-web
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      gateway-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app-network

  estoque-api:
    build:
      context: ../estoque-api
      dockerfile: Dockerfile
    container_name: estoque-api
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=estoquedb;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app-network
      - db-network
      - messaging-network
      - observability-network

  faturamento-api:
    build:
      context: ../faturamento-api
      dockerfile: Dockerfile
    container_name: faturamento-api
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - GIN_MODE=release
      - PORT=8082
      - ConnectionStrings__SqlServer=sqlserver://sa:YourPassword123!@sqlserver:1433?database=faturamentodb&encrypt=disable
      - ConnectionStrings__Redis=redis:6379
      - REDIS_HOST=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app-network
      - db-network
      - messaging-network
      - observability-network


