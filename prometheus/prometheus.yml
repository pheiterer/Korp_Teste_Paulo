global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'estoque-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['estoque-api:8080']

  - job_name: 'faturamento-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['faturamento-api:8080']
